services:
  cpa1:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-always}
    container_name: cpa1
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ${CPA1_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CPA1_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CPA1_LOG_PATH:-./logs}:/CLIProxyAPI/logs
    networks:
      - cpa-network
    restart: unless-stopped

  cpa2:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-always}
    container_name: cpa2
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "127.0.0.1:8318:8317"
    volumes:
      - ${CPA2_CONFIG_PATH:-./instances/cpa2/config.yaml}:/CLIProxyAPI/config.yaml
      - ${CPA2_AUTH_PATH:-./instances/cpa2/auths}:/root/.cli-proxy-api
      - ${CPA2_LOG_PATH:-./instances/cpa2/logs}:/CLIProxyAPI/logs
    networks:
      - cpa-network
    restart: unless-stopped

  cpa3:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: ${CLI_PROXY_PULL_POLICY:-always}
    container_name: cpa3
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "127.0.0.1:8319:8317"
    volumes:
      - ${CPA3_CONFIG_PATH:-./instances/cpa3/config.yaml}:/CLIProxyAPI/config.yaml
      - ${CPA3_AUTH_PATH:-./instances/cpa3/auths}:/root/.cli-proxy-api
      - ${CPA3_LOG_PATH:-./instances/cpa3/logs}:/CLIProxyAPI/logs
    networks:
      - cpa-network
    restart: unless-stopped

  sub2api:
    image: weishaw/sub2api:latest
    container_name: sub2api
    restart: unless-stopped
    ports:
      - "${SUB2API_BIND_HOST:-0.0.0.0}:${SUB2API_PORT:-18080}:8080"
    volumes:
      - ./sub2api-deploy/data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: "${SERVER_MODE:-release}"
      RUN_MODE: "${RUN_MODE:-standard}"
      DATABASE_HOST: "sub2api-postgres"
      DATABASE_PORT: "5432"
      DATABASE_USER: "${POSTGRES_USER:-sub2api}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      DATABASE_DBNAME: "${POSTGRES_DB:-sub2api}"
      DATABASE_SSLMODE: "disable"
      REDIS_HOST: "sub2api-redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@sub2api.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_EXPIRE_HOUR: "${JWT_EXPIRE_HOUR:-24}"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}"
      TZ: "${TZ:-Asia/Shanghai}"
      SECURITY_URL_ALLOWLIST_ENABLED: "${SECURITY_URL_ALLOWLIST_ENABLED:-false}"
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-true}"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-true}"
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api-redis:
        condition: service_healthy
      cpa1:
        condition: service_started
      cpa2:
        condition: service_started
      cpa3:
        condition: service_started
    networks:
      - cpa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cpa-quota-collector:
    build:
      context: ./sub2api-deploy
      dockerfile: quota-collector.Dockerfile
    container_name: cpa-quota-collector
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CPA_QUOTA_COLLECTOR_INSTANCES: "${CPA_QUOTA_COLLECTOR_INSTANCES:-cpa1=http://cpa1:8317,cpa2=http://cpa2:8317,cpa3=http://cpa3:8317}"
      CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY: "${CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY:-}"
      CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY_CPA1: "${CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY_CPA1:-}"
      CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY_CPA2: "${CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY_CPA2:-}"
      CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY_CPA3: "${CPA_QUOTA_COLLECTOR_MANAGEMENT_KEY_CPA3:-}"
      CPA_QUOTA_DATABASE_HOST: "sub2api-postgres"
      CPA_QUOTA_DATABASE_PORT: "5432"
      CPA_QUOTA_DATABASE_USER: "${POSTGRES_USER:-sub2api}"
      CPA_QUOTA_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      CPA_QUOTA_DATABASE_NAME: "${POSTGRES_DB:-sub2api}"
      CPA_QUOTA_DATABASE_SSLMODE: "disable"
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      cpa1:
        condition: service_started
      cpa2:
        condition: service_started
      cpa3:
        condition: service_started
    networks:
      - cpa-network

  cpa-dashboard:
    build:
      context: ./sub2api-deploy
      dockerfile: cpa-dashboard.Dockerfile
    profiles:
      - dashboard
    container_name: cpa-dashboard
    restart: unless-stopped
    ports:
      - "${CPA_DASHBOARD_BIND_HOST:-0.0.0.0}:${CPA_DASHBOARD_PORT:-18090}:18090"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CPA_DASHBOARD_BIND: "0.0.0.0:18090"
      CPA_DASHBOARD_LOGIN_PASSWORD: "${CPA_DASHBOARD_LOGIN_PASSWORD:?CPA_DASHBOARD_LOGIN_PASSWORD is required}"
      CPA_DASHBOARD_DATABASE_HOST: "sub2api-postgres"
      CPA_DASHBOARD_DATABASE_PORT: "5432"
      CPA_DASHBOARD_DATABASE_USER: "${CPA_DASHBOARD_DATABASE_USER:-sub2api_dashboard}"
      CPA_DASHBOARD_DATABASE_PASSWORD: "${CPA_DASHBOARD_DATABASE_PASSWORD:?CPA_DASHBOARD_DATABASE_PASSWORD is required}"
      CPA_DASHBOARD_DATABASE_NAME: "${POSTGRES_DB:-sub2api}"
      CPA_DASHBOARD_DATABASE_SSLMODE: "disable"
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api:
        condition: service_healthy
      cpa-quota-collector:
        condition: service_started
    networks:
      - cpa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:18090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  portal-api:
    build:
      context: ./sub2api-deploy
      dockerfile: portal-api.Dockerfile
    container_name: portal-api
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_HOST:-0.0.0.0}:${PORTAL_PORT:-18100}:18100"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      PORTAL_BIND: "0.0.0.0:18100"
      PORTAL_PUBLIC_SUB2API_BASE_URL: "${PORTAL_PUBLIC_SUB2API_BASE_URL:?PORTAL_PUBLIC_SUB2API_BASE_URL is required}"
      PORTAL_SESSION_SECRET: "${PORTAL_SESSION_SECRET:?PORTAL_SESSION_SECRET is required}"
      PORTAL_SESSION_TTL_HOURS: "${PORTAL_SESSION_TTL_HOURS:-24}"
      PORTAL_COOKIE_SECURE: "${PORTAL_COOKIE_SECURE:-false}"
      PORTAL_ALLOWED_ORIGINS: "${PORTAL_ALLOWED_ORIGINS:-}"
      PORTAL_BOOTSTRAP_ADMIN_EMAIL: "${PORTAL_BOOTSTRAP_ADMIN_EMAIL:-}"
      PORTAL_BOOTSTRAP_ADMIN_PASSWORD: "${PORTAL_BOOTSTRAP_ADMIN_PASSWORD:-}"
      PORTAL_DATABASE_HOST: "sub2api-postgres"
      PORTAL_DATABASE_PORT: "5432"
      PORTAL_DATABASE_USER: "${POSTGRES_USER:-sub2api}"
      PORTAL_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PORTAL_DATABASE_NAME: "${POSTGRES_DB:-sub2api}"
      PORTAL_DATABASE_SSLMODE: "disable"
      SUB2API_BASE_URL: "http://sub2api:8080"
      SUB2API_ADMIN_EMAIL: "${PORTAL_SUB2API_ADMIN_EMAIL:?PORTAL_SUB2API_ADMIN_EMAIL is required}"
      SUB2API_ADMIN_PASSWORD: "${PORTAL_SUB2API_ADMIN_PASSWORD:?PORTAL_SUB2API_ADMIN_PASSWORD is required}"
      SUB2API_DEFAULT_GROUP_NAME: "${PORTAL_SUB2API_DEFAULT_GROUP_NAME:-cpa-openai}"
      SUB2API_DEFAULT_KEY_QUOTA: "${PORTAL_SUB2API_DEFAULT_KEY_QUOTA:-0}"
    depends_on:
      sub2api-postgres:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    networks:
      - cpa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:18100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sub2api-postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    volumes:
      - ./sub2api-deploy/postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sub2api}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:-sub2api}"
      PGDATA: "/var/lib/postgresql/data"
      TZ: "${TZ:-Asia/Shanghai}"
    networks:
      - cpa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sub2api-redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    volumes:
      - ./sub2api-deploy/redis_data:/data
    command: >
      sh -c 'redis-server --save 60 1 --appendonly yes --appendfsync everysec'
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    networks:
      - cpa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  cpa-network:
    driver: bridge
