name: PJ14 responsibility boundary

on: [push, pull_request]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lightweight source boundary
        shell: bash
        run: |
          test "$(wc -l < AGENTS.md)" -le 80
          grep -Fq 'pj14-deploy' AGENTS.md
          grep -Fq 'this repository does not own deployment orchestration' AGENTS.md
