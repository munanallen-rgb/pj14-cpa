# Example Nginx domain split for AnixAPI.
#
# Safe rollout shape:
# - anixapi.com serves the Portal/user-facing console.
# - api.anixapi.com serves the Sub2API execution gateway.
# - api.anixapi.com/ returns a small JSON pointer instead of the Portal UI.
#
# Replace certificate paths and upstream addresses for the target host.

upstream anixapi_portal {
    server 127.0.0.1:18100;
}

upstream anixapi_gateway {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name anixapi.com www.anixapi.com api.anixapi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name anixapi.com www.anixapi.com;

    ssl_certificate /etc/letsencrypt/live/anixapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anixapi.com/privkey.pem;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://anixapi_portal;
    }
}

server {
    listen 443 ssl http2;
    server_name api.anixapi.com;

    ssl_certificate /etc/letsencrypt/live/api.anixapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.anixapi.com/privkey.pem;

    location = / {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"Anix API","website":"https://anixapi.com","docs":"https://anixapi.com/docs"}';
    }

    # Keep existing client integrations working by forwarding all API-domain
    # traffic except the root pointer to the current Sub2API gateway.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://anixapi_gateway;
    }
}
